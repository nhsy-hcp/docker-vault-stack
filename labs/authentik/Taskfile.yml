---
version: '3'

vars:
  # Lab-local compose file; interpolates variables from the root .env
  COMPOSE: docker compose --env-file ../../.env -f docker-compose.yml
  NETWORK: docker-vault-stack
  # Must match var.vault_oidc_mount_path
  OIDC_MOUNT: authentik-oidc

tasks:
  all:
    desc: Complete setup workflow (up + setup-admin + init + apply)
    cmds:
      - task: up
      - ./scripts/setup-admin.sh
      - task: init
      - task: apply

  up:
    desc: Start Authentik services on the shared stack network
    preconditions:
      - sh: test -f ../../.env
        msg: Root .env not found
      - sh: docker network inspect {{.NETWORK}} > /dev/null 2>&1
        msg: Network {{.NETWORK}} not found - start the core stack first (task up)
    cmds:
      - "{{.COMPOSE}} up -d --pull=missing"
      - echo "Authentik - http://authentik.localhost:9000"

  down:
    desc: Stop and remove Authentik containers (keeps volumes)
    cmds:
      - "{{.COMPOSE}} down"

  down:clean:
    desc: Stop Authentik and remove its volumes
    prompt: This will delete all Authentik data. Continue?
    cmds:
      - "{{.COMPOSE}} down -v"

  logs:
    desc: View logs from all services
    cmds:
      - "{{.COMPOSE}} logs -f authentik-postgres authentik authentik-worker"

  logs-server:
    desc: View Authentik server logs
    cmds:
      - "{{.COMPOSE}} logs -f authentik"

  logs-worker:
    desc: View Authentik worker logs
    cmds:
      - "{{.COMPOSE}} logs -f authentik-worker"

  logs-postgres:
    desc: View PostgreSQL logs
    cmds:
      - "{{.COMPOSE}} logs -f authentik-postgres"

  redeploy:
    desc: Stop Authentik services, remove volumes, and restart
    prompt: This will delete all Authentik data and restart services. Continue?
    cmds:
      - echo "Stopping Authentik services..."
      - "{{.COMPOSE}} stop authentik-postgres authentik authentik-worker"
      - echo "Removing volumes..."
      - "{{.COMPOSE}} down -v authentik-postgres authentik authentik-worker"
      - echo "Starting Authentik services..."
      - "{{.COMPOSE}} up -d authentik-postgres authentik authentik-worker"
      - echo "Authentik redeployed successfully"
      - echo "Access Authentik at http://authentik.localhost:9000"

  restart:
    desc: Restart Authentik stack
    cmds:
      - "{{.COMPOSE}} restart authentik-postgres authentik authentik-worker"

  status:
    desc: Show status of all services
    cmds:
      - "{{.COMPOSE}} ps authentik-postgres authentik authentik-worker"

  init:
    desc: Initialize Terraform
    dir: .
    cmds:
      - terraform init

  plan:
    desc: Run Terraform plan
    dir: .
    cmds:
      - |
        source ../../.env
        terraform plan

  apply:
    desc: Apply Terraform configuration
    dir: .
    cmds:
      - |
        source ../../.env
        terraform apply -auto-approve

  destroy:
    desc: Destroy Terraform resources
    dir: .
    prompt: This will destroy all Terraform-managed resources. Continue?
    cmds:
      - |
        source ../../.env
        terraform destroy -auto-approve

  purge:
    desc: Remove Terraform state and disable Vault OIDC auth
    dir: .
    silent: true
    prompt: This will remove Terraform state and disable Vault OIDC auth. Continue?
    cmds:
      - echo "Removing Terraform state resources..."
      - terraform state rm vault_jwt_auth_backend.root || true
      - terraform state rm vault_jwt_auth_backend_role.root || true
      - terraform state rm vault_policy.admin || true
      - terraform state rm vault_policy.tn001_team1_reader || true
      - terraform state rm vault_policy.tn001_team2_reader || true
      - terraform state rm vault_policy.tn001_ui || true
      - echo "Disabling Vault OIDC auth..."
      - |
        source ../../.env
        vault auth disable {{.OIDC_MOUNT}} || echo "OIDC auth already disabled or not found"
        vault auth disable -namespace=admin {{.OIDC_MOUNT}} || echo "Admin namespace OIDC auth already disabled or not found"
      - echo "Purge completed"

  test-auth:
    desc: Test OIDC authentication
    cmds:
      - ./scripts/demo-auth.sh

  check-policies:
    desc: Check current token policies
    cmds:
      - ./scripts/check-policies.sh

  scim:test:
    desc: Test SCIM endpoints and verify provisioned users/groups
    dir: .
    cmds:
      - ./scripts/test-scim.sh

  scim:sync:
    desc: View SCIM sync status (Note - Authentik syncs automatically on changes and hourly)
    dir: .
    silent: true
    cmds:
      - |
        source ../../.env
        SCIM_ID=$(terraform output -raw authentik_scim_provider_id 2>/dev/null)
        if [ -z "${SCIM_ID}" ]; then
          echo "SCIM not enabled or provider IDs not available. Apply with enable_scim=true first."
          exit 1
        fi
        echo "=== SCIM Provider Status ==="
        echo ""
        echo "Provider ID: ${SCIM_ID}"
        echo "Note: Authentik syncs automatically:"
        echo "  - Real-time on user/group changes"
        echo "  - Full sync every hour"
        echo ""
        echo "Provider Configuration:"
        curl -sf -H "Authorization: Bearer ${AUTHENTIK_TOKEN}" \
          "${AUTHENTIK_URL}/api/v3/providers/scim/${SCIM_ID}/" | \
          jq -r '"  URL: \(.url)\n  Sync Page Size: \(.sync_page_size)\n  Sync Timeout: \(.sync_page_timeout)\n  Dry Run: \(.dry_run)"'

  bootstrap:
    desc: Complete setup from scratch (requires task authentik:up)
    cmds:
      - echo "Ensure Authentik services are running - task authentik:up"
      - echo "Waiting for Authentik to be ready..."
      - sleep 30
      - echo "Access Authentik at http://authentik.localhost:9000"
      - echo "1. Login with admin credentials"
      - echo "2. Generate API token - Admin Interface > Tokens > Create"
      - echo "3. Copy token to .env as AUTHENTIK_TOKEN"
      - echo "4. Run - task authentik init && task authentik apply"

  health:
    desc: Check health of all services
    silent: true
    cmds:
      - |
        echo "=== Authentik Health Check ==="
        echo ""
        echo "PostgreSQL:"
        if {{.COMPOSE}} exec authentik-postgres pg_isready -U authentik > /dev/null 2>&1; then
          echo "  ✓ PostgreSQL is ready"
        else
          echo "  ✗ PostgreSQL is not ready"
        fi
        echo ""
        echo "Authentik Server:"
        if curl -sf http://authentik.localhost:9000/-/health/live/ > /dev/null 2>&1; then
          echo "  ✓ Authentik is healthy"
          echo "  URL: http://authentik.localhost:9000"
        else
          echo "  ✗ Authentik is not ready"
        fi
        echo ""
        echo "Container Status:"
        {{.COMPOSE}} ps authentik-postgres authentik authentik-worker
