# config file version
apiVersion: 1

datasources:
  - name: prometheus
    type: prometheus
    access: server
    orgId: 1
    url: http://prometheus:9090
    password:
    user:
    database:
    basicAuth:
    basicAuthUser:
    basicAuthPassword:
    withCredentials:
    isDefault: true
    jsonData:
      graphiteVersion: "1.1"
      # Match Alloy's default Vault scrape interval so $__rate_interval spans enough samples
      timeInterval: "60s"
      tlsAuth: false
      tlsAuthWithCACert: false
    secureJsonData:
      tlsCACert: ""
      tlsClientCert: ""
      tlsClientKey: ""
    # Bump when changing settings: Grafana skips provisioning if its stored version is higher
    version: 3
    editable: true
  - name: loki
    type: loki
    access: server
    orgId: 1
    url: http://loki:3100
    password:
    user:
    version: 1
    editable: true
