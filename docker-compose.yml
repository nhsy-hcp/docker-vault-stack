services:
  vault:
    image: hashicorp/vault-enterprise:${VAULT_VERSION:-2.1-ent}
    container_name: ${COMPOSE_PROJECT_NAME}_vault
    restart: unless-stopped
    ports:
      - "${VAULT_PORT:-8200}:8200"
    networks:
      default:
        aliases:
          - vault.localhost
    environment:
      VAULT_ADDR: ${VAULT_ADDR:-http://localhost:8200}
      VAULT_LICENSE: ${VAULT_LICENSE:-}
      VAULT_LOG_LEVEL: ${VAULT_LOG_LEVEL:-info}
      VAULT_SKIP_VERIFY: ${VAULT_SKIP_VERIFY:-true}
      VAULT_TOKEN: ${VAULT_TOKEN:-}
      # Image has no setcap binary; mlock is disabled in raft.hcl (disable_mlock = true)
      SKIP_SETCAP: "true"
    cap_add:
      - IPC_LOCK
      - SETFCAP
    configs:
      - source: vault-config
        target: /vault/config/raft.hcl
    volumes:
      - vault-data:/vault/file  # Need this volume to fudge permissions error
      - vault-logs:/vault/logs
    # Start as root so the image's docker-entrypoint.sh can chown /vault/{config,file,logs}
    # then drop to the vault user via su-exec (it also adds -config=/vault/config).
    user: root
    command: ["server"]
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s # Give Vault time to start before checking

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.2}
    container_name: ${COMPOSE_PROJECT_NAME}_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      default:
        aliases:
          - grafana.localhost
    configs:
      - source: grafana-datasources
        target: /etc/grafana/provisioning/datasources/datasources.yml
      - source: grafana-dashboards-config
        target: /etc/grafana/provisioning/dashboards/dashboards.yml
    volumes:
      - ./volumes/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    depends_on:
      - prometheus
      - loki

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.14.0}
    container_name: ${COMPOSE_PROJECT_NAME}_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    networks:
      default:
        aliases:
          - prometheus.localhost
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yml
      - source: prometheus-rules
        target: /etc/prometheus/vault-rules.yml
    volumes:
      #- ./volumes/prometheus/prometheus-token:/etc/prometheus/prometheus-token:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-remote-write-receiver'

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.7.8}
    container_name: ${COMPOSE_PROJECT_NAME}_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    networks:
      default:
        aliases:
          - loki.localhost
#    configs:
#      - source: loki-config
#        target: /etc/loki/loki.yml
    volumes:
      - ./volumes/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki/data
#      - ./volumes/loki/loki_perm_fix.sh:/loki/loki_perm_fix.sh:ro
    command: -config.file=/etc/loki/loki.yml
#    entrypoint: /loki/loki_perm_fix.sh

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.19.2}
    container_name: ${COMPOSE_PROJECT_NAME}_alloy
#    deploy:
#      replicas: 0
    restart: unless-stopped
    networks:
      default:
        aliases:
          - alloy.localhost
    environment:
      - VAULT_ADDR=https://vault:8200
      #- VAULT_TOKEN=/etc/prometheus/prometheus-token
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    volumes:
      - alloy-data:/var/lib/alloy/data
      - vault-logs:/mnt/vault-logs:ro
      #- ./volumes/prometheus/prometheus-token:/etc/prometheus/prometheus-token:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
#    user: root
    depends_on:
      - loki

configs:
  vault-config:
    file: ./volumes/vault/raft.hcl
  grafana-datasources:
    file: ./volumes/grafana/datasources.yml
  grafana-dashboards-config:
    file: ./volumes/grafana/dashboards.yml
  prometheus-config:
    file: ./volumes/prometheus/prometheus.yml
  prometheus-rules:
    file: ./volumes/prometheus/vault-rules.yml
  loki-config:
    file: ./volumes/loki/loki.yml
  alloy-config:
    file: ./volumes/alloy/config.alloy

networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
  promtail-data:
  alloy-data:
  vault-data:
  vault-logs:
